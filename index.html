<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOAP 1.2 Query</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f7f7f7;
      color: #222;
    }
    button {
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
      border: 1px solid #007acc;
      background: #007acc;
      color: #fff;
      border-radius: 4px;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      color: #555;
    }
    .response-panel {
      display: grid;
      gap: 20px;
      margin-top: 20px;
    }
    .panel {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 4px 12px rgba(0,0,0,.04);
    }
    .panel h2 {
      margin-top: 0;
      font-size: 1.15rem;
      color: #003366;
    }
    .structured-output {
      max-height: 520px;
      overflow: auto;
    }
    pre {
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 0.95rem;
    }
    details.xml-node {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 12px;
      background: #f8fafc;
    }
    details.xml-node summary {
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }
    .xml-node .xml-value {
      margin-top: 8px;
      padding: 10px 12px;
      background: #fff;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      color: #111827;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .xml-node .xml-children {
      margin-top: 10px;
      display: grid;
      gap: 10px;
    }
    .section-block {
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: #f8fafc;
      padding: 14px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5);
      margin-bottom: 14px;
    }
    .section-block-title {
      margin: 0 0 10px 0;
      font-size: 0.98rem;
      font-weight: 700;
      color: #0f172a;
    }
    .input-row {
      display: grid;
      gap: 8px;
      margin-bottom: 18px;
    }
    .input-row label {
      font-weight: 600;
      color: #0f172a;
    }
    .text-input {
      width: 100%;
      max-width: 360px;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      color: #111827;
      background: #fff;
    }
    .parti-cards {
      display: grid;
      gap: 10px;
    }
    .parti-card {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 14px 16px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }
    .parti-card-title {
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .parti-card-meta {
      color: #475569;
      line-height: 1.5;
    }
    .xml-empty {
      color: #6b7280;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>Cautare dosare in sistemul ECRIS</h1>
  <p>Cautare dosare in sistemul ECRIS prin introducerea numarului de dosar sau numele uneia dintre parti</p>
  <div class="section-block input-row">
    <label for="searchType">Cautare dosare dupa:</label>
    <select id="searchType" class="text-input">
      <option value="numarDosar">Număr dosar</option>
      <option value="numeParte">Nume parte</option>
    </select>
  </div>
  <div class="section-block input-row">
    <label id="searchValueLabel" for="numarDosar">Număr dosar</label>
    <input id="numarDosar" class="text-input" type="text" value="" placeholder="">
  </div>
  <button id="soapButton">Cautare</button>

  <div class="response-panel">
    <section class="panel">
      <h2>Dosare:</h2>
      <div class="structured-output" id="structuredResult">
        <div class="xml-empty">Efectuati o căutare pentru a vedea dosarele.</div>
      </div>
    </section>
  </div>

  <script>
    const soapButton = document.getElementById('soapButton');
    const structuredResult = document.getElementById('structuredResult');

    const soapUrl = 'http://portalquery.just.ro/Query.asmx';

    function escapeXml(value) {
      return value
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&apos;');
    }

    function buildSoapPayload(fieldName, fieldValue) {
      return `<?xml version="1.0" encoding="utf-8"?>
<soap12:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap12="http://www.w3.org/2003/05/soap-envelope">
    <soap12:Body>
        <CautareDosare xmlns="portalquery.just.ro">
            <${fieldName}>${escapeXml(fieldValue)}</${fieldName}>
        </CautareDosare>
    </soap12:Body>
</soap12:Envelope>`;
    }

    function escapeHtml(value) {
      const div = document.createElement('div');
      div.textContent = value;
      return div.innerHTML;
    }

    function renderElement(element, open = true) {
      const children = Array.from(element.children);
      const textValue = element.textContent.trim();
      const actualText = children.length === 0 ? textValue : textValue.replace(/\s+/g, ' ').trim();
      const node = document.createElement('details');
      node.className = 'xml-node';
      node.open = open;

      const summary = document.createElement('summary');
      summary.innerHTML = escapeHtml(element.localName);
      node.appendChild(summary);

      const content = document.createElement('div');
      content.className = 'xml-children';

      if (children.length === 0) {
        const value = document.createElement('div');
        value.className = 'xml-value';
        value.textContent = actualText || '—';
        content.appendChild(value);
      } else {
        children.forEach((child) => {
          content.appendChild(renderElement(child, true));
        });
      }

      node.appendChild(content);
      return node;
    }

    function renderDosar(dosar) {
      const wrapper = document.createElement('details');
      wrapper.className = 'xml-node';
      wrapper.open = false;

      const numero = dosar.getAttribute('numar') || dosar.querySelector('numar')?.textContent?.trim() || 'Dosar';
      const partiNames = Array.from(dosar.querySelectorAll('parti > DosarParte > nume')).map((node) => node.textContent.trim()).filter(Boolean);
      const label = partiNames.length > 0 ? `${numero} - Parti: ${partiNames.join(', ')}` : numero;

      const summary = document.createElement('summary');
      summary.innerHTML = escapeHtml(label);
      wrapper.appendChild(summary);

      const content = document.createElement('div');
      content.className = 'xml-children';

      const infoChildren = Array.from(dosar.children).filter((child) => {
        const tag = child.tagName.toLowerCase();
        return !['parti', 'sedinte', 'caiatac', 'numar', 'numarvechi', 'departament', 'datamodificare', 'categorie', 'categoriecaz', 'categoriecaznume', 'stadiuprocesualnume'].includes(tag);
      });

      function humanizeTagName(tag) {
        const map = {
          numar: 'Număr',
          numarVechi: 'Număr vechi',
          departament: 'Departament',
          dataModificare: 'Dată modificare',
          categorieCaz: 'Categorie caz',
          categorieCazNume: 'Categorie caz nume',
          data: 'Dată',
          ora: 'Oră',
          complet: 'Complet',
          solutie: 'Soluție',
          solutieSumar: 'Rezumat soluție',
          numarDocument: 'Număr document',
          dataDocument: 'Dată document',
          dataPronuntare: 'Dată pronunțare',
          tipCaleAtac: 'Tip cale atac',
          parteDeclaratoare: 'Parte declaratoare',
          dataDeclarare: 'Dată declarare',
          institutie: 'Instituție',
          obiect: 'Obiect',
          stadiuProcesual: 'Stadiu procesual',
          categorieCazNume: 'Categorie caz nume'
        };
        return map[tag] || tag.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/^./, (str) => str.toUpperCase());
      }

      function humanizeText(value) {
        if (!value) {
          return '—';
        }
        let text = value.trim();
        text = text.replace(/Curteade/g, 'Curtea de ');
        text = text.replace(/([a-zăîșțâ])([A-ZĂÎȘȚÂ])/g, '$1 $2');
        return text;
      }

      function formatInfoValue(tag, value) {
        if (!value) {
          return '—';
        }
        const cleanValue = value.trim();
        if (['data', 'dataPronuntare', 'dataDocument'].includes(tag)) {
          return formatRomanianDate(cleanValue);
        }
        return humanizeText(cleanValue);
      }

      if (infoChildren.length > 0) {
        const infoWrapper = document.createElement('div');
        infoWrapper.className = 'section-block';

        const infoTitle = document.createElement('div');
        infoTitle.className = 'section-block-title';
        infoTitle.textContent = 'Informatii Generale';
        infoWrapper.appendChild(infoTitle);

        const infoCard = document.createElement('div');
        infoCard.className = 'info-card';

        infoChildren.forEach((child) => {
          const row = document.createElement('div');
          row.className = 'info-card-row';
          const key = humanizeTagName(child.localName);
          let value = '';
          const grandchildren = Array.from(child.children);
          if (grandchildren.length === 0) {
            value = formatInfoValue(child.localName, child.textContent || '—');
          } else {
            value = grandchildren
              .map((gc) => `${humanizeTagName(gc.localName)}: ${formatInfoValue(gc.localName, gc.textContent || '—')}`)
              .join(', ');
            value = escapeHtml(value);
          }
          row.innerHTML = `<strong>${key}:</strong> ${value}`;
          infoCard.appendChild(row);
        });

        infoWrapper.appendChild(infoCard);
        content.appendChild(infoWrapper);
      }

      const partiSection = dosar.querySelector('parti');
      if (partiSection) {
        const wrapper = document.createElement('div');
        wrapper.className = 'section-block';

        const title = document.createElement('div');
        title.className = 'section-block-title';
        title.textContent = 'Parti Dosar';
        wrapper.appendChild(title);

        const partiCards = renderPartiCards(partiSection);
        wrapper.appendChild(partiCards);
        content.appendChild(wrapper);
      }

      const sedinteSection = dosar.querySelector('sedinte');
      if (sedinteSection) {
        const wrapper = document.createElement('div');
        wrapper.className = 'section-block';

        const title = document.createElement('div');
        title.className = 'section-block-title';
        title.textContent = 'Sedinte';
        wrapper.appendChild(title);

        const sedintaCards = renderSedintaCards(sedinteSection);
        wrapper.appendChild(sedintaCards);
        content.appendChild(wrapper);
      }

      wrapper.appendChild(content);
      return wrapper;
    }

    function renderPartiCards(partiSection) {
      const cards = document.createElement('div');
      cards.className = 'parti-cards';

      Array.from(partiSection.querySelectorAll('DosarParte')).forEach((parte) => {
        const name = parte.querySelector('nume')?.textContent?.trim() || 'Nume necunoscut';
        const quality = parte.querySelector('calitateParte')?.textContent?.trim() || 'Calitate necunoscută';

        const card = document.createElement('div');
        card.className = 'parti-card';

        const title = document.createElement('div');
        title.className = 'parti-card-title';
        title.textContent = `Nume: ${name}`;

        const meta = document.createElement('div');
        meta.className = 'parti-card-meta';
        meta.textContent = `în calitate de: ${quality}`;

        card.appendChild(title);
        card.appendChild(meta);
        cards.appendChild(card);
      });

      return cards;
    }

    function formatRomanianDate(dateText) {
      if (!dateText) {
        return 'Data necunoscută';
      }
      try {
        const date = new Date(dateText);
        if (Number.isNaN(date.getTime())) {
          return dateText;
        }
        return date.toLocaleDateString('ro-RO', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric'
        });
      } catch (error) {
        return dateText;
      }
    }

    function formatRomanianTime(timeText) {
      if (!timeText) {
        return 'Ora necunoscută';
      }
      const normalized = timeText.trim();
      if (!normalized) {
        return 'Ora necunoscută';
      }
      // If time is already a valid HH:mm or HH:mm:ss format, normalize to HH:mm
      const parts = normalized.split(':');
      if (parts.length >= 2) {
        const [hour, minute] = parts;
        return `${hour.padStart(2, '0')}:${minute.padStart(2, '0')}`;
      }
      return normalized;
    }

    function renderSedintaCards(sedinteSection) {
      const cards = document.createElement('div');
      cards.className = 'parti-cards';

      Array.from(sedinteSection.querySelectorAll('DosarSedinta')).forEach((sedinta) => {
        const dateRaw = sedinta.querySelector('data')?.textContent?.trim() || '';
        const timeRaw = sedinta.querySelector('ora')?.textContent?.trim() || '';
        const date = formatRomanianDate(dateRaw);
        const time = formatRomanianTime(timeRaw);
        const complet = sedinta.querySelector('complet')?.textContent?.trim() || 'Complet necunoscut';
        const solutie = sedinta.querySelector('solutie')?.textContent?.trim() || 'Solutie necunoscuta';
        const summary = sedinta.querySelector('solutieSumar')?.textContent?.trim() || '';

        const card = document.createElement('div');
        card.className = 'parti-card';

        const title = document.createElement('div');
        title.className = 'parti-card-title';
        title.textContent = `${date} ${time !== 'Ora necunoscută' ? 'ora ' + time : ''}`.trim();

        const meta = document.createElement('div');
        meta.className = 'parti-card-meta';
        meta.innerHTML = escapeHtml(`Complet: ${complet}\nSolutie: ${solutie}`).replace(/\n/g, '<br>');

        card.appendChild(title);
        card.appendChild(meta);

        if (summary) {
          const summaryDiv = document.createElement('div');
          summaryDiv.className = 'parti-card-meta';
          summaryDiv.style.marginTop = '8px';
          summaryDiv.textContent = summary;
          card.appendChild(summaryDiv);
        }

        cards.appendChild(card);
      });

      return cards;
    }

    function displayStructured(xmlText) {
      structuredResult.innerHTML = '';
      const parser = new DOMParser();
      const doc = parser.parseFromString(xmlText, 'application/xml');
      if (doc.querySelector('parsererror')) {
        structuredResult.innerHTML = `<div class="xml-empty">Unable to parse XML response.</div>`;
        return;
      }

      const envelope = doc.documentElement;
      if (!envelope) {
        structuredResult.innerHTML = `<div class="xml-empty">No XML content found.</div>`;
        return;
      }

      let body = null;
      if (doc.getElementsByTagNameNS) {
        const bodies = doc.getElementsByTagNameNS('http://www.w3.org/2003/05/soap-envelope', 'Body');
        if (bodies.length > 0) {
          body = bodies[0];
        }
      }
      if (!body) {
        const bodies = doc.getElementsByTagName('Body');
        if (bodies.length > 0) {
          body = bodies[0];
        }
      }

      const payloadRoot = body ? body.firstElementChild : envelope.firstElementChild;
      if (!payloadRoot) {
        structuredResult.innerHTML = `<div class="xml-empty">No SOAP body content available.</div>`;
        return;
      }

      const dosare = payloadRoot.getElementsByTagNameNS('*', 'Dosar');
      if (dosare.length === 0) {
        structuredResult.innerHTML = `<div class="xml-empty">No Dosar objects found.</div>`;
        return;
      }

      Array.from(dosare).forEach((dosar) => {
        structuredResult.appendChild(renderDosar(dosar));
      });
    }

    const searchTypeInput = document.getElementById('searchType');
    const searchValueLabel = document.getElementById('searchValueLabel');
    const numarDosarInput = document.getElementById('numarDosar');

    function updateSearchFieldLabel() {
      const type = searchTypeInput.value;
      if (type === 'numeParte') {
        searchValueLabel.textContent = 'Nume parte';
        numarDosarInput.placeholder = 'Nume parte';
        numarDosarInput.value = '';
      } else {
        searchValueLabel.textContent = 'Număr dosar';
        numarDosarInput.placeholder = 'Număr dosar';
        numarDosarInput.value = '';
      }
    }

    searchTypeInput.addEventListener('change', updateSearchFieldLabel);
    updateSearchFieldLabel();

    soapButton.addEventListener('click', async () => {
      soapButton.disabled = true;
      structuredResult.innerHTML = '<div class="xml-empty">Loading response...</div>';

      try {
        const fieldName = searchTypeInput.value || 'numarDosar';
        const fieldValue = numarDosarInput.value.trim();
        const response = await fetch(soapUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/soap+xml; charset=utf-8'
          },
          body: buildSoapPayload(fieldName, fieldValue)
        });

        const text = await response.text();
        displayStructured(text);
      } catch (error) {
        structuredResult.innerHTML = `<div class="xml-empty">${escapeHtml(error.message || String(error))}</div>`;
        console.error('SOAP request error:', error);
      } finally {
        soapButton.disabled = false;
      }
    });
  </script>
</body>
</html>
